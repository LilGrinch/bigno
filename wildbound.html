<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wildbound</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#18251b;font-family:system-ui;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:auto}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#102018cc;border:1px solid #ffffff25;border-radius:14px;padding:8px 10px;backdrop-filter:blur(5px);box-shadow:0 4px 18px #0005}.stats{display:grid;grid-template-columns:repeat(3,auto);gap:5px 10px;font-size:12px}.bar{width:70px;height:7px;background:#ffffff20;border-radius:5px;overflow:hidden}.fill{height:100%;width:100%;background:#65c466}.warn{background:#e7a83e}.danger{background:#df5a4f}.controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.stick{width:112px;height:112px;border-radius:50%;background:#ffffff15;border:2px solid #ffffff25;position:relative}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffff35;left:30px;top:30px}.actions{display:grid;grid-template-columns:repeat(2,62px);gap:9px}.btn{height:58px;border:1px solid #ffffff25;border-radius:16px;background:#102018cc;color:#fff;font-weight:700;font-size:12px;box-shadow:0 4px 15px #0005}.btn:active{transform:scale(.95);background:#2d5a3c}.msg{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#102018e8;border-radius:12px;padding:9px 14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}.msg.show{opacity:1}.title{font-weight:800;font-size:18px}.objective{font-size:11px;opacity:.8;margin-top:2px}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="panel"><div class="title">WILDBOUND</div><div class="objective" id="obj">Gather 6 wood & 3 stone</div></div><div class="panel"><div class="stats"><span>❤️ <i id="hp">100</i></span><span>🍖 <i id="food">100</i></span><span>💧 <i id="water">100</i></span><span>⚡ <i id="energy">100</i></span><span>🪵 <i id="wood">0</i></span><span>🪨 <i id="stone">0</i></span></div></div></div><div class="msg" id="msg"></div><div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="gather">GATHER</button><button class="btn" id="craft">CAMPFIRE</button><button class="btn" id="eat">EAT</button><button class="btn" id="drink">DRINK</button></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const state={x:0,y:0,hp:100,food:100,water:100,energy:100,wood:0,stone:0,day:1,time:0,camp:false,dead:false};let resources=[];let seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function makeWorld(){resources=[];for(let i=0;i<75;i++){let a=rnd()*Math.PI*2,r=120+rnd()*900;resources.push({x:Math.cos(a)*r,y:Math.sin(a)*r,t:rnd()<.62?'tree':'rock',alive:true})}}makeWorld();
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={active:false,x:0,y:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob');function joyMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),lim=42;if(m>lim){x=x/m*lim;y=y/m*lim}joy.x=x/lim;joy.y=y/lim;knob.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('pointerdown',e=>{joy.active=true;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>joy.active&&joyMove(e));stick.addEventListener('pointerup',()=>{joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});
function msg(s){let m=document.getElementById('msg');m.textContent=s;m.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>m.classList.remove('show'),1800)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(){let best=null,bd=78;for(const r of resources)if(r.alive){let dd=Math.hypot(r.x-state.x,r.y-state.y);if(dd<bd){bd=dd;best=r}}return best}
document.getElementById('gather').onclick=()=>{let r=nearest();if(!r){msg('Move closer to a tree or rock.');return}r.alive=false;if(r.t==='tree'){state.wood+=2;msg('Collected 2 wood 🪵')}else{state.stone+=1;msg('Collected 1 stone 🪨')}updateUI()};
document.getElementById('craft').onclick=()=>{if(state.camp){msg('Your campfire is already burning.');return}if(state.wood>=6&&state.stone>=3){state.wood-=6;state.stone-=3;state.camp=true;msg('Campfire built! 🔥');document.getElementById('obj').textContent='Survive the night';updateUI()}else msg(`Need ${Math.max(0,6-state.wood)} wood and ${Math.max(0,3-state.stone)} stone.`)};
document.getElementById('eat').onclick=()=>{if(state.food<20){msg('No food left.');return}state.food-=20;state.energy=Math.min(100,state.energy+12);msg('You ate some food.');updateUI()};document.getElementById('drink').onclick=()=>{if(state.water<20){msg('No water left.');return}state.water-=20;state.water=Math.max(0,state.water);state.energy=Math.min(100,state.energy+8);msg('You drank some water.');updateUI()};
function updateUI(){for(let k of ['hp','food','water','energy','wood','stone'])document.getElementById(k).textContent=Math.round(state[k])}let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!state.dead){let ax=(keys.d?1:0)-(keys.a?1:0)+joy.x,ay=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=Math.hypot(ax,ay);if(m){ax/=m;ay/=m;let sp=145*(state.energy<20?.65:1);state.x+=ax*sp*dt;state.y+=ay*sp*dt;state.energy=Math.max(0,state.energy-1.5*dt)}state.time+=dt/180;if(state.time>=1){state.time=0;state.day++;state.camp=false;document.getElementById('obj').textContent='Gather 6 wood & 3 stone';msg('A new day begins.');}state.food=Math.max(0,state.food-.7*dt);state.water=Math.max(0,state.water-1*dt);if(state.food===0||state.water===0)state.hp=Math.max(0,state.hp-3*dt);if(state.hp<=0){state.dead=true;msg('You collapsed. Tap the screen to restart.')}updateUI()}draw();requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#244b31';ctx.fillRect(0,0,W,H);let scale=1,ox=W/2-state.x,oy=H/2-state.y;ctx.save();ctx.translate(ox,oy);ctx.fillStyle='#2b5838';for(let gx=-1200;gx<1200;gx+=80)for(let gy=-1200;gy<1200;gy+=80){ctx.globalAlpha=.18;ctx.fillRect(gx+10,gy+10,2,2)}ctx.globalAlpha=1;for(const r of resources){if(!r.alive)continue;let sx=r.x,sy=r.y;if(r.t==='tree'){ctx.fillStyle='#173b25';ctx.fillRect(sx-5,sy+8,10,22);ctx.fillStyle='#356d3e';ctx.beginPath();ctx.arc(sx,sy,24,0,7);ctx.fill();ctx.fillStyle='#477f48';ctx.beginPath();ctx.arc(sx-10,sy-9,16,0,7);ctx.fill()}else{ctx.fillStyle='#6f7568';ctx.beginPath();ctx.moveTo(sx-18,sy+10);ctx.lineTo(sx-10,sy-14);ctx.lineTo(sx+10,sy-18);ctx.lineTo(sx+20,sy+8);ctx.lineTo(sx+4,sy+17);ctx.closePath();ctx.fill()}}if(state.camp){ctx.fillStyle='#9b5d2d';for(let i=0;i<5;i++){ctx.save();ctx.translate(-state.x,-state.y);ctx.restore()}ctx.beginPath();ctx.arc(state.x,state.y+34,20,0,7);ctx.fill();ctx.fillStyle='#ffb52e';ctx.beginPath();ctx.arc(state.x,state.y+28,13,0,7);ctx.fill();ctx.fillStyle='#ffe082';ctx.beginPath();ctx.arc(state.x,state.y+27,6,0,7);ctx.fill()}ctx.fillStyle='#d9b07a';ctx.beginPath();ctx.arc(state.x,state.y,15,0,7);ctx.fill();ctx.fillStyle='#3d6b9a';ctx.fillRect(state.x-12,state.y+10,24,22);ctx.fillStyle='#17232b';ctx.fillRect(state.x-8,state.y-3,5,5);ctx.fillRect(state.x+4,state.y-3,5,5);ctx.restore();let night=Math.max(0,(Math.sin(state.time*Math.PI*2-Math.PI/2)+1)/2);ctx.fillStyle=`rgba(5,12,28,${night*(state.camp?.22:.55)})`;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffffcc';ctx.font='12px system-ui';ctx.fillText(`DAY ${state.day}  •  ${night>.65?'NIGHT':'DAY'}`,W/2-35,92)}requestAnimationFrame(loop);
addEventListener('pointerdown',e=>{if(state.dead){location.reload()}});</script></body></html>
